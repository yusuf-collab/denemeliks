<!DOCTYPE html>

<head>

    <title>Sweet.§ Edits (@zeku.sweet) | TikTok</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #ffffff;
            color: #121212;
            padding: 30px 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 1000px;
        }

        /* Profil Üst Alanı */
        .profile-header {
            display: flex;
            align-items: flex-start;
            gap: 24px;
            margin-bottom: 24px;
        }

        .avatar {
            width: 116px;
            height: 116px;
            border-radius: 50%;
            overflow: hidden;
            flex-shrink: 0;
            background-color: #f1f1f2;
        }

        .avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .profile-info {
            display: flex;
            flex-direction: column;
        }

        .title-row {
            display: flex;
            align-items: baseline;
            gap: 12px;
            margin-bottom: 12px;
        }

        .display-name {
            font-size: 24px;
            font-weight: 700;
            color: #121212;
        }

        .username {
            font-size: 16px;
            color: #73747b;
            font-weight: 400;
        }

        .stats-row {
            display: flex;
            gap: 20px;
            font-size: 16px;
            margin-bottom: 16px;
        }

        .stat-item {
            color: #73747b;
        }

        .stat-item strong {
            color: #121212;
            font-weight: 700;
        }

        .action-buttons {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 16px;
        }

        .btn-edit, .btn-promote {
            background-color: #f1f1f2;
            color: #121212;
            font-weight: 600;
            font-size: 15px;
            padding: 6px 16px;
            border-radius: 4px;
            border: none;
            cursor: pointer;
        }

        .icon-btn {
            background-color: #f1f1f2;
            border: none;
            width: 36px;
            height: 36px;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 16px;
        }

        .bio {
            font-size: 15px;
            line-height: 1.4;
            color: #121212;
        }

        /* Sekmeler ve Filtre Barı */
        .tabs-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #e3e3e4;
            margin-top: 10px;
            margin-bottom: 20px;
        }

        .tabs {
            display: flex;
            gap: 32px;
        }

        .tab {
            font-size: 18px;
            font-weight: 600;
            color: #73747b;
            padding-bottom: 8px;
            cursor: pointer;
            position: relative;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .tab.active {
            color: #121212;
        }

        .tab.active::after {
            content: '';
            position: absolute;
            bottom: -1px;
            left: 0;
            width: 100%;
            height: 2px;
            background-color: #121212;
        }

        .filter-buttons {
            display: flex;
            background-color: #f1f1f2;
            border-radius: 4px;
            padding: 2px;
        }

        .filter-btn {
            border: none;
            background: transparent;
            padding: 4px 12px;
            font-size: 13px;
            color: #73747b;
            cursor: pointer;
            border-radius: 2px;
        }

        .filter-btn.active {
            background-color: #ffffff;
            color: #121212;
            font-weight: 600;
        }

        /* 6'lı Video Grid Yapısı */
        .video-grid {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 16px 12px;
        }

        @media (max-width: 900px) {
            .video-grid {
                grid-template-columns: repeat(3, 1fr);
            }
        }

        .video-card {
            aspect-ratio: 3/4;
            border-radius: 4px;
            background-size: cover;
            background-position: center;
            background-color: #000;
            position: relative;
            overflow: hidden;
            text-decoration: none;
        }

        .views-count {
            position: absolute;
            bottom: 8px;
            left: 8px;
            color: #ffffff;
            font-size: 13px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 4px;
            text-shadow: 0 1px 3px rgba(0,0,0,0.8);
        }
    </style>
