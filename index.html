 <!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sweet.§ Edits</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #0d0e12;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        /* Tek Ana Profil Kartı */
        .tiktok-card {
            width: 100%;
            max-width: 750px;
            background-color: #121318;
            border: 1px solid #2a2b36;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.6);
        }

        /* Profil Üst Tarafı */
        .profile-header {
            display: flex;
            align-items: center;
            gap: 25px;
            margin-bottom: 25px;
            flex-wrap: wrap;
        }

        .profile-avatar {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            border: 3px solid #7f5af0;
            overflow: hidden;
            background-color: #1a1b23;
            flex-shrink: 0;
        }

        .profile-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .profile-info h1 {
            font-size: 1.8rem;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 2px;
        }

        .profile-info .username {
            color: #7f5af0;
            font-size: 0.95rem;
            font-weight: 600;
            margin-bottom: 12px;
        }

        .profile-stats {
            display: flex;
            gap: 15px;
            background-color: #1a1b23;
            padding: 10px 18px;
            border-radius: 10px;
            border: 1px solid #2a2b36;
            margin-bottom: 12px;
            width: fit-content;
        }

        .stat-item {
            font-size: 0.9rem;
            color: #a7a9be;
        }

        .stat-item strong {
            color: #ffffff;
        }

        .profile-bio {
            font-size: 0.9rem;
            color: #d1d5db;
            line-height: 1.5;
        }

        /* Video Izgarası */
        .section-title {
            font-size: 0.95rem;
            font-weight: 600;
            color: #a7a9be;
            margin: 25px 0 15px 0;
            padding-top: 20px;
            border-top: 1px solid #2a2b36;
        }

        .video-grid {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 10px;
        }

        @media (max-width: 650px) {
            .video-grid {
                grid-template-columns: repeat(3, 1fr);
            }
        }

        .video-item {
            aspect-ratio: 3/4;
            border-radius: 8px;
            border: 1px solid #2a2b36;
            background-size: cover;
            background-position: center;
            background-color: #1a1b23;
            display: flex;
            align-items: flex-end;
            padding: 6px;
            text-decoration: none;
            transition: transform 0.2s, border-color 0.2s;
        }

        .video-item:hover {
            transform: translateY(-3px);
            border-color: #fe2c55;
        }

        .views-badge {
            font-size: 0.7rem;
            font-weight: bold;
            color: #ffffff;
            background: rgba(0, 0, 0, 0.75);
            padding: 2px 6px;
            border-radius: 4px;
        }

        /* TikTok Butonu */
        .tiktok-btn {
            display: block;
            width: 100%;
            text-align: center;
            margin-top: 25px;
            background-color: #fe2c55;
            color: #ffffff;
            padding: 14px;
            border-radius: 12px;
            text-decoration: none;
            font-weight: bold;
            font-size: 1rem;
            transition: opacity 0.2s;
        }

        .tiktok-btn:hover {
            opacity: 0.9;
        }
    </style>
</head>
